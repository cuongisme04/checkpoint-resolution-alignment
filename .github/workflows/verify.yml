name: Verify retained results

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: CPU analysis replay (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Verify inputs, protocols and numerical results
        run: python scripts/verify_release.py
      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
      - name: Save verification report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: build/verification/
          if-no-files-found: warn
          retention-days: 30
